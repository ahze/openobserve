name: openobserve-cit

services:
  openobserve:
    image: ghcr.io/daemonless/openobserve:build-latest
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - ZO_ROOT_USER_EMAIL=test@example.com
      - ZO_ROOT_USER_PASSWORD=SuperSecret@123
      - ZO_HTTP_PORT=5085
      - ZO_GRPC_PORT=5086
#    ports:
#      - 5080:5080
#      - 5081:5081
