name: Build FreeBSD Container

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  build:
    uses: daemonless/dbuild/.github/workflows/daemonless-build.yaml@feat/vm-mem-runner-swap
    with:
      image_name: openobserve
      vm_mem: 40960      # web crate: one rustc peaks above 22 GB
      host_swap_gb: 40
    secrets: inherit
